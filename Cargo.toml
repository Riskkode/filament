[package]
name = "filament"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.29", features = ["serde"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
ignore = "0.4.25"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-english = "0.1.8"
